<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개설 과목 | SNU IE Navigator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="SNU IE Navigator 홈"><span class="brand-mark">IE</span><span>SNU IE Navigator</span></a>
    <nav class="nav" aria-label="주요 메뉴">
      <a href="roadmap.html">로드맵</a><a href="rules.html">이수규정</a><a href="faq.html">FAQ</a><a href="courses.html">개설 과목</a>
    </nav>
  </header>
  <main>
    <section class="section">
      <div class="section-head">
        <p class="eyebrow">Courses</p>
        <h1>개설 과목 탐색</h1>
        <p>과목명, 코드, 분야로 검색하고 전공필수 과목만 빠르게 걸러볼 수 있습니다.</p>
      </div>
      <div class="toolbar">
        <label class="search">
          <span>검색</span>
          <input id="courseSearch" type="search" placeholder="예: 데이터, 406.315, 인간공학">
        </label>
        <button class="filter active" type="button" data-filter="all">전체</button>
        <button class="filter" type="button" data-filter="required">전공필수</button>
        <button class="filter" type="button" data-filter="data">데이터/컴퓨팅</button>
      </div>
      <div class="course-grid" id="courseGrid"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
