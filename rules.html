<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이수규정 | SNU IE Navigator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="SNU IE Navigator 홈">
      <span class="brand-mark">IE</span>
      <span>SNU IE Navigator</span>
    </a>
    <nav class="nav" aria-label="주요 메뉴">
      <a href="roadmap.html">로드맵</a>
      <a href="rules.html">이수규정</a>
      <a href="faq.html">FAQ</a>
      <a href="courses.html">개설 과목</a>
    </nav>
  </header>

  <main>
    <section class="notice" aria-label="안내">
      <strong>중요:</strong>
      이 페이지는 업로드한 전공이수규정 PDF를 바탕으로 정리한 비공식 안내입니다.
      최종 졸업 판정, 교과목 인정, 예외 처리는 학과 행정실과 공식 문서를 기준으로 확인하세요.
    </section>

    <section class="section rules-page">
      <div class="section-head">
        <p class="eyebrow">Requirements</p>
        <h1>학번별 이수규정</h1>
        <p>입학 학번을 입력하거나 빠른 선택을 누르면 단전공생 이수학점, 교양 영역별 학점, 전선 인정 과목, 복수전공·부전공·자유전공 기준을 보여줍니다.</p>
      </div>

      <div class="student-year-panel">
        <label class="year-input">
          <span>입학 학번</span>
          <input id="studentYear" type="number" min="2020" max="2026" step="1" placeholder="예: 2025">
        </label>
        <div class="year-picks" aria-label="학번 빠른 선택">
          <button class="year-chip" type="button" data-year="2020">20학번</button>
          <button class="year-chip" type="button" data-year="2021">21학번</button>
          <button class="year-chip" type="button" data-year="2022">22학번</button>
          <button class="year-chip" type="button" data-year="2023">23학번</button>
          <button class="year-chip" type="button" data-year="2024">24학번</button>
          <button class="year-chip active" type="button" data-year="2025">25학번</button>
          <button class="year-chip" type="button" data-year="2026">26학번</button>
        </div>
      </div>

      <div class="rule-output" id="ruleOutput" aria-live="polite"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
